<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" role="img" aria-labelledby="title desc">
<title id="title">Northam and Merredin in the Western Australian Wheatbelt</title>
<desc id="desc">A geographic reference map showing Perth near the west coast, Northam inland to the north-east, and Merredin further east. Northam represents the Central Wheatbelt model setting and Merredin the Eastern Wheatbelt setting. No model-region boundaries are shown.</desc>
<metadata>Coastline: Natural Earth 1:50m admin-0 countries, public domain, retrieved 13 October 2026. https://www.naturalearthdata.com/ Approximate town coordinates: Perth 31.95 S 115.86 E, Northam 31.65 S 116.67 E (Perth Observatory almanac); Merredin 31.48 S 118.28 E (Bureau of Meteorology station 010092). Map uses a local equirectangular projection at 31.65 S.</metadata>
